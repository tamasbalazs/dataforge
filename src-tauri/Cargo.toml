[package]
name = "dataforge"
version = "0.1.0"
description = "DataForge – data science IDE for R and Python"
edition = "2021"
rust-version = "1.80"

[lib]
name = "dataforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "fs", "io-util", "net", "signal"] }
zeromq = { version = "0.7", default-features = false, features = ["tokio-runtime", "tcp-transport"] }
bytes = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
anyhow = "1"
dirs = "6"
base64 = "0.22"
notify = "8"
trash = "5"
tauri-plugin-opener = "2"
portable-pty = "0.9"
zip = { version = "2", default-features = false, features = ["deflate"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 4
lto = "thin"
opt-level = 3
strip = true
